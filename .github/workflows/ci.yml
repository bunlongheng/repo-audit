name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # The renderer and the evidence gate are standard-library only - no install step.
      - name: Renderer + evidence gate contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Golden sample renders
        run: python3 render.py golden/sample-data.json --no-open
